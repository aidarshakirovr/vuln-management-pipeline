# Local DefectDojo, adapted from the official compose file at tag 3.5.300:
# https://github.com/DefectDojo/django-DefectDojo/blob/3.5.300/docker-compose.yml
#
# Differences from upstream:
# - published images only (no local Dockerfile build)
# - Django and nginx images pinned to 3.5.300
# - no default passwords or Django secret keys; copy .env.example to .env
# - Postgres and Valkey are not published on the host
#
# UI and API: http://localhost:8080  (override with DD_PORT)
# HTTPS:      https://localhost:8443 (override with DD_TLS_PORT)

services:
  nginx:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-nginx:${DD_VERSION:-3.5.300}"
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: ${NGINX_METRICS_ENABLED:-false}
      DD_UWSGI_HOST: ${DD_UWSGI_HOST:-uwsgi}
      DD_UWSGI_PORT: ${DD_UWSGI_PORT:-3031}
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - target: 8080
        published: ${DD_PORT:-8080}
        protocol: tcp
      - target: 8443
        published: ${DD_TLS_PORT:-8443}
        protocol: tcp

  uwsgi:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:${DD_VERSION:-3.5.300}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-uwsgi.sh
    environment:
      DD_DEBUG: "False"
      DD_DJANGO_METRICS_ENABLED: ${DD_DJANGO_METRICS_ENABLED:-False}
      DD_ALLOWED_HOSTS: ${DD_ALLOWED_HOSTS:-*}
      DD_DATABASE_URL: "postgresql://${DD_DATABASE_USER:?Set DD_DATABASE_USER in .env}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}/${DD_DATABASE_NAME:?Set DD_DATABASE_NAME in .env}"
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: ${DD_DATABASE_READINESS_TIMEOUT:-30}
    volumes:
      - type: bind
        source: ./deploy/defectdojo/extra_settings
        target: /app/docker/extra_settings
        read_only: true
      - defectdojo_media:/app/media

  celerybeat:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:${DD_VERSION:-3.5.300}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-celery-beat.sh
    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: ${DD_ALLOWED_HOSTS:-*}
      DD_DATABASE_URL: "postgresql://${DD_DATABASE_USER:?Set DD_DATABASE_USER in .env}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}/${DD_DATABASE_NAME:?Set DD_DATABASE_NAME in .env}"
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: ${DD_DATABASE_READINESS_TIMEOUT:-30}
    volumes:
      - type: bind
        source: ./deploy/defectdojo/extra_settings
        target: /app/docker/extra_settings
        read_only: true

  celeryworker:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:${DD_VERSION:-3.5.300}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - -t
      - "30"
      - --
      - /entrypoint-celery-worker.sh
    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: ${DD_ALLOWED_HOSTS:-*}
      DD_DATABASE_URL: "postgresql://${DD_DATABASE_USER:?Set DD_DATABASE_USER in .env}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}/${DD_DATABASE_NAME:?Set DD_DATABASE_NAME in .env}"
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: ${DD_DATABASE_READINESS_TIMEOUT:-30}
    volumes:
      - type: bind
        source: ./deploy/defectdojo/extra_settings
        target: /app/docker/extra_settings
        read_only: true
      - defectdojo_media:/app/media

  initializer:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:${DD_VERSION:-3.5.300}"
    depends_on:
      postgres:
        condition: service_started
    entrypoint:
      - /wait-for-it.sh
      - "${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}"
      - --
      - /entrypoint-initializer.sh
    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: ${DD_ALLOWED_HOSTS:-*}
      DD_DATABASE_URL: "postgresql://${DD_DATABASE_USER:?Set DD_DATABASE_USER in .env}:${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}@${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}/${DD_DATABASE_NAME:?Set DD_DATABASE_NAME in .env}"
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: "${DD_SECRET_KEY:?Set DD_SECRET_KEY in .env}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?Set DD_CREDENTIAL_AES_256_KEY in .env}"
      DD_DATABASE_READINESS_TIMEOUT: ${DD_DATABASE_READINESS_TIMEOUT:-30}
      DD_ADMIN_USER: ${DD_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:?Set DD_ADMIN_PASSWORD in .env}"
      DD_ADMIN_MAIL: ${DD_ADMIN_MAIL:-admin@localhost}
      DD_ADMIN_FIRST_NAME: ${DD_ADMIN_FIRST_NAME:-Admin}
      DD_ADMIN_LAST_NAME: ${DD_ADMIN_LAST_NAME:-User}
      DD_INITIALIZE: ${DD_INITIALIZE:-true}
    volumes:
      - type: bind
        source: ./deploy/defectdojo/extra_settings
        target: /app/docker/extra_settings
        read_only: true

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: "${DD_DATABASE_NAME:?Set DD_DATABASE_NAME in .env}"
      POSTGRES_USER: "${DD_DATABASE_USER:?Set DD_DATABASE_USER in .env}"
      POSTGRES_PASSWORD: "${DD_DATABASE_PASSWORD:?Set DD_DATABASE_PASSWORD in .env}"
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
      - defectdojo_valkey:/data

volumes:
  defectdojo_postgres: {}
  defectdojo_media: {}
  defectdojo_valkey: {}
