[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmp"
version = "0.1.0"
description = "Parse, deduplicate, prioritize, and report vulnerability scanner findings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "aidarshakirovr"}]
dependencies = ["cvss==3.6"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
vmp = "vmp.cli:main"

[tool.setuptools]
packages = ["vmp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["vmp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
